---
- name: Install Kubernetes cluster tools
  hosts: localhost
  become: true
  tasks:
    - name: Install AWS CLI
      ansible.builtin.pip:
        name: 
          - awscli
        state: present

    - name: Download kops
      ansible.builtin.get_url:
        url: "https://github.com/kubernetes/kops/releases/download/v1.32.0/kops-linux-amd64"
        dest: /usr/local/bin/kops
        mode: '0755'


    - name: Download kubectl
      ansible.builtin.get_url:
        url: "https://dl.k8s.io/release/v1.33.0/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: '0755'

